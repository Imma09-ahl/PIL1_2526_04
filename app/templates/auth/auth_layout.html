<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}IFRI MentorLink{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1a237e",
                        secondary: "#00c853",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        background: "#f9f9fb",
                        surface: "#ffffff",
                        "on-background": "#1a1c1d",
                        "on-surface": "#1a1c1d",
                        "outline-variant": "#e2e2e4",
                        "surface-container-low": "#f3f3f5",
                        "primary-container": "#e8eaf6",
                        "on-primary-container": "#1a237e"
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        lg: "1rem",
                        xl: "1.5rem",
                        full: "9999px"
                    },
                    spacing: {
                        sm: "12px",
                        lg: "24px",
                        md: "16px",
                        xl: "32px"
                    },
                    fontFamily: {
                        "body-md": ["Lora", "serif"],
                        "headline-lg": ["Playfair Display", "serif"],
                        "display-lg": ["Playfair Display", "serif"]
                    },
                    maxWidth: {
                        "container-max": "1280px"
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .dark { background-color: #0a0f1e; color: #f9f9fb; }
        .dark body { background-color: #0a0f1e; }
        .dark .bg-background { background-color: #0a0f1e; }
        .dark .bg-surface { background-color: #111827; }
        .dark .bg-surface-container-low { background-color: #1f2937; }
        .dark .text-on-background { color: #f9f9fb; }
        .dark .text-on-surface { color: #f9f9fb; }
        .dark .border-outline-variant { border-color: #374151; }
        .dark .bg-primary-container { background-color: #1a237e; }
        .dark .text-on-primary-container { color: #e8eaf6; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            const applyTheme = (theme) => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    themeToggleLightIcon.classList.remove('hidden');
                    themeToggleDarkIcon.classList.add('hidden');
                } else {
                    document.documentElement.classList.remove('dark');
                    themeToggleDarkIcon.classList.remove('hidden');
                    themeToggleLightIcon.classList.add('hidden');
                }
            };

            const savedTheme = localStorage.getItem('color-theme')
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme(savedTheme);

            themeToggleBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                const newTheme = isDark ? 'light' : 'dark';
                localStorage.setItem('color-theme', newTheme);
                applyTheme(newTheme);
            });
        });
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md transition-colors duration-300">

    <header class="w-full border-b border-outline-variant bg-surface dark:bg-[#0a0f1e] sticky top-0 z-50">
        <div class="flex justify-between items-center px-lg py-md max-w-container-max mx-auto">
            <a class="flex items-center gap-sm hover:opacity-80 transition-opacity" href="/">
                <span class="material-symbols-outlined text-primary dark:text-secondary text-3xl">school</span>
                <span class="font-headline-lg text-xl text-primary dark:text-secondary font-bold">IFRI MentorLink</span>
            </a>
            <div class="flex items-center gap-md">
                <a class="hidden sm:flex items-center gap-xs text-sm text-on-surface-variant dark:text-gray-300 hover:text-primary dark:hover:text-secondary transition-colors" href="/">
                    <span class="material-symbols-outlined text-base">arrow_back</span>
                    Accueil
                </a>
                <button class="text-on-surface-variant dark:text-on-surface hover:bg-surface-container-low rounded-full p-2 transition-colors cursor-pointer" id="theme-toggle" type="button">
                    <span class="material-symbols-outlined" id="theme-toggle-dark-icon">dark_mode</span>
                    <span class="material-symbols-outlined hidden" id="theme-toggle-light-icon">light_mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-lg py-xl">
        <div class="w-full max-w-md">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="py-md text-center text-xs text-on-surface-variant dark:text-gray-500 border-t border-outline-variant">
        © 2026 IFRI MentorLink — Projet PIL1 2025-2026
    </footer>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
